name: MCG gates

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  mcg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: MCG unit tests
        run: node --test test/*.test.mjs
      - name: Import and syntax smoke
        run: node scripts/check-syntax.mjs
      - name: Secret, path and personal-data scan
        run: node scripts/scan-sensitive.mjs
      - name: Dashboard smoke
        run: node --test test/dashboard.test.mjs
      - name: Contracts smoke
        run: node --test test/contracts.test.mjs
      - name: Local Runtime typecheck and tests
        run: |
          pnpm --dir packages/local-runtime typecheck
          pnpm --dir packages/local-runtime test:unit
      - name: Operating Core typecheck and tests
        run: |
          pnpm --dir packages/operating-core typecheck
          pnpm --dir packages/operating-core test:unit
